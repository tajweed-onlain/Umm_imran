const ayahs = [
{ar:'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ', tr:'Бисмилляхи-р-Рахмани-р-Рахим', ru:'Во имя Аллаха, Милостивого, Милосердного!', au:'everyayah.com'},
{ar:'الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ', tr:'Аль-хамду лилляхи Раббиль-‘алямин', ru:'Хвала Аллаху, Господу миров,', au:'everyayah.com'},
{ar:'الرَّحْمَٰنِ الرَّحِيمِ', tr:'Ар-Рахмани-р-Рахим', ru:'Милостивому, Милосердному,', au:'everyayah.com'},
{ar:'مَالِكِ يَوْمِ الدِّينِ', tr:'Малики яуми-д-дин', ru:'Властелину Дня воздаяния!', au:'everyayah.com'}
];
let audio = new Audio();
function renderSurah() {
const sBox = document.getElementById('surahBox');
sBox.innerHTML = '';
ayahs.forEach(a => {
const d = document.createElement('div'); d.className = 'ayah';
d.innerHTML = <div class="ayah-top"><button class="play-btn">▶</button><div class="ayah-ar">${a.ar}</div></div><div style="color:var(--accent-l);font-size:14px;font-style:italic">${a.tr}</div><div style="color:var(--muted);font-size:13px">${a.ru}</div>;
const btn = d.querySelector('.play-btn');
btn.onclick = () => {
document.querySelectorAll('.play-btn').forEach(x=>{x.classList.remove('active'); x.textContent='▶';});
audio.src = a.au; audio.play(); btn.classList.add('active'); btn.textContent='❚❚';
audio.onended = () => { btn.classList.remove('active'); btn.textContent='▶'; };
};
sBox.appendChild(d);
});
}
function openAdmin() {
const p = prompt('Введите пароль от панели управления (по умолчанию 2026):');
if (p !== config.pass) return alert('Неверный пароль');
document.getElementById('a-tg').value = config.tg;
document.getElementById('a-pass').value = config.pass;
document.getElementById('a-brand').value = config.brand;
document.getElementById('a-sub').value = config.sub || 'Коран онлайн';
document.getElementById('a-title').value = config.title;
document.getElementById('a-desc').value = config.desc;
document.getElementById('a-theme').value = config.theme;
document.getElementById('a-color').value = config.color;
document.getElementById('a-style').value = config.style;
renderAdminLists();
document.getElementById('adminModal').style.display = 'block';
}
function closeAdmin() { document.getElementById('adminModal').style.display = 'none'; }
function switchTab(id, btn) {
document.querySelectorAll('.admin-sec').forEach(s=>s.classList.remove('active'));
document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
document.getElementById(id).classList.add('active'); btn.classList.add('active');
}

document.getElementById('a-faq-list').innerHTML = config.faq.map((f,i)=> <div class="admin-item-box"> <input value="${f.q}" onchange="config.faq[${i}].q=this.value" style="margin-bottom:6px;width:100%;padding:8px;"> <textarea onchange="config.faq[${i}].a=this.value" style="width:100%;padding:8px;">${f.a}</textarea> <button onclick="config.faq.splice(${i},1);renderAdminLists()" style="color:#e55;margin-top:6px;">Удалить</button> </div>).join('');
}
